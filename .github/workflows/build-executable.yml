name: Build Executable

on:
  push:
    branches:
      - v1.0

jobs:
  build:
    name: Build for ${{ matrix.os_name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os_name: Windows
            arch: x86_64
            asset_name: InvoiceManager-Windows-x86_64.exe
            pyinstaller_artifact_name: InvoiceManager.exe
          - runner: ubuntu-latest
            os_name: Linux
            arch: x86_64
            asset_name: InvoiceManager-Linux-x86_64
            pyinstaller_artifact_name: InvoiceManager
          - runner: macos-13
            os_name: macOS
            arch: x86_64
            asset_name: InvoiceManager-macOS-x86_64
            pyinstaller_artifact_name: InvoiceManager
          - runner: macos-14
            os_name: macOS
            arch: ARM64
            asset_name: InvoiceManager-macOS-ARM64
            pyinstaller_artifact_name: InvoiceManager

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name InvoiceManager src/main.py

      - name: Rename artifact
        shell: bash
        run: |
          mv dist/${{ matrix.pyinstaller_artifact_name }} dist/${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须有写入权限才能创建 Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "release-${{ github.run_number }}-${{ github.run_attempt }}"
          name: "Release ${{ github.run_number }}"
          body: "Automated release of executables."
          files: |
            artifacts/*/* 