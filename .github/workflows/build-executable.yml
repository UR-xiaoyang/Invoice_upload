name: Build Executable

on:
  push:
    branches:
      - v1.0

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: InvoiceManager.exe
            asset_name: InvoiceManager-Windows.exe
          - os: ubuntu-latest
            artifact_name: InvoiceManager
            asset_name: InvoiceManager-Linux
          - os: macos-latest
            artifact_name: InvoiceManager
            asset_name: InvoiceManager-macOS

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name InvoiceManager src/main.py

      - name: Rename artifact
        shell: bash
        run: |
          mv dist/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
        continue-on-error: true # 允许在找不到文件时继续 